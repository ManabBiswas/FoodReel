# Render deployment config for the FoodReel backend (server/).


services:
  - type: web
    name: foodreel-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Required at startup (server.js exits if missing) ---

      - key: NODE_VERSION
        value: "22.11.0"
      - key: NODE_ENV
        value: production

      - key: FRONTEND_URL
        value: https://foodreel-watch.netlify.app
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_SERVICE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
